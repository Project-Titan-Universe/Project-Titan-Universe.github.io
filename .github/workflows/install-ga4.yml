name: Install GA4 Tag

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - '.github/workflows/install-ga4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-ga4:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add GA4 tag to site pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          measurement_id = "G-PC84WN2CVS"
          snippet = "\n".join([
              "<!-- Google tag (gtag.js) -->",
              f'<script async src="https://www.googletagmanager.com/gtag/js?id={measurement_id}"></script>',
              "<script>",
              "  window.dataLayer = window.dataLayer || [];",
              "  function gtag(){dataLayer.push(arguments);}",
              "  gtag('js', new Date());",
              f"  gtag('config', '{measurement_id}');",
              "</script>",
          ])

          changed = []
          for path in sorted(Path('.').glob('*.html')):
              # Google Search Console verification files must remain exact.
              if path.name.lower().startswith('google'):
                  continue

              text = path.read_text(encoding='utf-8')
              if measurement_id in text:
                  continue

              updated, count = re.subn(
                  r'(<head\b[^>]*>)',
                  lambda m: m.group(1) + '\n' + snippet,
                  text,
                  count=1,
                  flags=re.IGNORECASE,
              )

              if count:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.name)

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit GA4 installation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "GA4 tag already present on all site pages."
            exit 0
          fi
          git commit -m "Install Google Analytics tag"
          git push
