name: Patch social links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-social-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Instagram and TikTok links
        run: |
          python3 -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); s=s.replace("            \"https://www.facebook.com/ProjectTitanUniverse/\",\n            \"https://www.youtube.com/@ProjectTitanUniverse\"", "            \"https://www.facebook.com/ProjectTitanUniverse/\",\n            \"https://www.instagram.com/projecttitanuniverse/\",\n            \"https://www.tiktok.com/@projecttitanuniverse\",\n            \"https://www.youtube.com/@ProjectTitanUniverse\""); s=s.replace("        <a href=\"https://www.facebook.com/ProjectTitanUniverse/\" target=\"_blank\" rel=\"noopener noreferrer\">Facebook</a>\n        &nbsp;•&nbsp;\n        <a href=\"https://www.youtube.com/@ProjectTitanUniverse\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube</a>", "        <a href=\"https://www.facebook.com/ProjectTitanUniverse/\" target=\"_blank\" rel=\"noopener noreferrer\">Facebook</a>\n        &nbsp;•&nbsp;\n        <a href=\"https://www.instagram.com/projecttitanuniverse/\" target=\"_blank\" rel=\"noopener noreferrer\">Instagram</a>\n        &nbsp;•&nbsp;\n        <a href=\"https://www.tiktok.com/@projecttitanuniverse\" target=\"_blank\" rel=\"noopener noreferrer\">TikTok</a>\n        &nbsp;•&nbsp;\n        <a href=\"https://www.youtube.com/@ProjectTitanUniverse\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube</a>"); p.write_text(s)'

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Instagram and TikTok links"
          git push
