name: Add YouTube channel link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-youtube-link.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Add YouTube link to homepage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          goodreads = 'https://www.goodreads.com/user/show/77642333-justin-nead'
          youtube = 'https://www.youtube.com/@ProjectTitanUniverse'

          old_same_as = '''          "sameAs": [\n            "https://www.goodreads.com/user/show/77642333-justin-nead"\n          ]'''
          new_same_as = '''          "sameAs": [\n            "https://www.goodreads.com/user/show/77642333-justin-nead",\n            "https://www.youtube.com/@ProjectTitanUniverse"\n          ]'''
          if old_same_as in text:
              text = text.replace(old_same_as, new_same_as, 1)

          old_footer = '<a href="https://www.goodreads.com/user/show/77642333-justin-nead" target="_blank" rel="noopener noreferrer">Goodreads</a>'
          new_footer = old_footer + '\n        &nbsp;•&nbsp;\n        <a href="https://www.youtube.com/@ProjectTitanUniverse" target="_blank" rel="noopener noreferrer">YouTube</a>'
          if youtube not in text.split('<footer>', 1)[-1]:
              if old_footer not in text:
                  raise SystemExit('Expected Goodreads footer link not found')
              text = text.replace(old_footer, new_footer, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Add YouTube channel link to homepage"
            git push
          fi
